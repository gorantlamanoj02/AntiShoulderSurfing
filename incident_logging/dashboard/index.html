
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Security Operations Console</title>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1220;
            color: #e5e7eb;
            padding: 30px;
        }

        h1 { color: #f8fafc; }

        .subtitle { color: #94a3b8; }

        .cards {
            display: flex;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .card {
            background: #1e293b;
            padding: 24px;
            border-radius: 12px;
            min-width: 170px;
            flex: 1;
        }

        .card h2 {
            margin: 10px 0 0;
            font-size: 32px;
        }

        .green { color: #4ade80; }
        .red { color: #f87171; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid #334155;
            text-align: left;
        }

        th { color: #94a3b8; }

        #latest {
            background: #450a0a;
            border: 1px solid #dc2626;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>

<body>

    <h1>Security Operations Console</h1>
    <p class="subtitle">
        Anti-Shoulder-Surfing Intrusion Monitoring
    </p>

    <div class="cards">
        <div class="card">
            Connection
            <h2 id="connection">Connecting</h2>
        </div>

        <div class="card">
            Stored Incidents
            <h2 id="count">0</h2>
        </div>

        <div class="card">
            Monitoring
            <h2 class="green">Active</h2>
        </div>
    </div>

    <div id="latest"></div>

    <h2>Security Incident History</h2>

    <table>
        <thead>
            <tr>
                <th>Timestamp (UTC)</th>
                <th>Workstation</th>
                <th>Event</th>
                <th>Snapshot</th>
            </tr>
        </thead>

        <tbody id="incidentTable"></tbody>
    </table>

    <script>
        const socket = io({
            transports: ["websocket", "polling"]
        });

        const table = document.getElementById(
            "incidentTable"
        );
        
    function addIncident(incident) {
        const row = table.insertRow(0);

        [
        incident.timestamp,
        incident.workstation,
        incident.event
        ].forEach(value => {
        const cell = row.insertCell();
        cell.textContent = value;
    });
        const snapshotCell = row.insertCell();
        if (incident.snapshot_url) {
        
            const link = document.createElement("a");
            link.href = incident.snapshot_url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";

            const image = document.createElement("img");
            image.src = incident.snapshot_url;
            image.alt = "Intrusion snapshot";
            image.style.width = "110px";
            image.style.borderRadius = "6px";
            
            link.appendChild(image);
            snapshotCell.appendChild(link);

        } else {
        snapshotCell.textContent = "No snapshot";
        }
        
        while (table.rows.length > 100) {
        table.deleteRow(-1);
    }
}


        async function loadIncidents() {
            const response = await fetch("/api/incidents");
            const incidents = await response.json();

            table.replaceChildren();

            incidents.forEach(item => addIncident(item));

            document.getElementById("count").textContent =
                incidents.length;
        }

        socket.on("connect", () => {
            document.getElementById(
                "connection"
            ).textContent = "Online";

            loadIncidents();
        });

        socket.on("disconnect", () => {
            document.getElementById(
                "connection"
            ).textContent = "Offline";
        });

        socket.on("security_alert", incident => {
            // Reload from database to stay consistent
            loadIncidents();

            const latest = document.getElementById(
                "latest"
            );

            latest.style.display = "block";
            latest.textContent =
                "SECURITY ALERT: " +
                incident.event +
                " | " +
                incident.workstation;
        });

        loadIncidents();
    </script>

</body>
</html>
